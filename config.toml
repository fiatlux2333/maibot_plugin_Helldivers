# ============================================================
# 绝地潜兵2情报助手（maibot_plugin_Helldivers）配置
# -------------------------------------------------------------
# · 本文件附带中文注释；MaiBot Runner 加载时会保留注释，
#   仅自动补齐缺失字段，可放心修改和保留注释。
# · 修改后需重载插件（WebUI 或 touch plugin.py）生效。
# · 文件末尾 [plugin] 节为 Runner 保留节（config_version），勿删改。
# · bilibili_cookie / translation_api_key 等密钥请勿提交到仓库。
# ============================================================


# ──────────── API 基础 ────────────

# Helldivers 2 社区 API 根地址（默认官方社区 API）
api_base = "https://api.helldivers2.dev"

# 当前战争 ID（赛季变更时可能需要修改，当前默认 801）
war_id = 801

# API 联系邮箱 (X-Super-Contact)；建议填写真实邮箱，遵守 API 礼仪
api_contact = ""

# API 客户端标识 (X-Super-Client)
api_client_name = "maibot_plugin_Helldivers"

# User-Agent
api_user_agent = "maibot_plugin_Helldivers/1.0.0"

# API 请求超时（秒）
api_timeout = 20

# HTTP 代理（可选），例如 http://127.0.0.1:7890，留空不使用
proxy_url = ""


# ──────────── Companion 截图 ────────────

# 启用 Helldivers Companion 图片指令（/hd2news、/companion、/dss、/planet 的原网页截图）；失败时返回错误提示
enable_companion_screenshots = true

# Companion 图片后端：playwright=容器内 Chromium 原网页截图并支持翻译（推荐）；local=Pillow 数据卡片；browserless=仅在关闭翻译时使用远程英文网页截图
companion_render_backend = "playwright"

# Browserless 截图服务地址；同一 Docker 网络可使用 http://browserless:3000，也可填写 Browserless Cloud 地址
companion_browserless_url = "http://browserless:3000"

# Browserless Token（可选）；自建服务未配置 Token 时留空，勿提交到仓库
companion_browserless_token = ""

# 访问 Browserless 服务所用代理（可选）；同 Docker 网络时通常留空
companion_browserless_proxy_url = ""

# Companion 截图总超时（秒）
companion_screenshot_timeout = 60

# Companion 页面加载后的额外等待时间（毫秒）；SPA 页面建议 3000-8000
companion_screenshot_wait_ms = 5000

# Companion 页面数据加载等待时间（秒）；等待 PLEASE WAIT DEMOCRATICALLY 消失或目标页面就绪，云服务器建议 20-40
companion_page_load_timeout = 20.0

# Companion 前台翻译等待时间（秒）；免费模型建议 45-90，超时后发送已完成的部分翻译，后台继续写入缓存
companion_translation_timeout = 60.0

# Companion 单批翻译等待时间（秒）；每批最多 16 段，免费模型建议 15-25，且不得高于前台翻译等待时间
companion_translation_batch_timeout = 20.0

# Companion 截图缓存时间（秒）
companion_screenshot_cache_ttl = 300

# Companion 单张截图最大字节数
companion_screenshot_max_bytes = 12582912

# Companion 单张截图最大像素数
companion_screenshot_max_pixels = 20000000

# Companion 首页显示低活跃度战役卡片（约 +1.5s）；注意该设置会持久化到网站，可能影响浏览器访问 Companion 的默认状态
companion_show_inactive = false

# Companion 截图后台预热：后台定时截图并预翻译，用户请求时直接返回已翻译缓存截图，无需等待翻译 API
companion_warmup_enabled = true

# Companion 后台预热间隔（秒）；建议 300，最小 60
companion_warmup_interval = 300

# Companion 后台预热页面（逗号分隔）：news_latest=最新新闻、station=民主空间站、homepage=首页；默认含 homepage 以便 /companion 命中热缓存（MaiBot 命令有调用时长上限）
companion_warmup_kinds = "news_latest,station,homepage"

# 启用 Companion 新闻推送：开启后在目标群发送 /hd2news订阅，Companion 新闻更新时自动推送翻译截图；需同时启用截图与后台预热
companion_news_push_enabled = false


# ──────────── B 站银河快报 ────────────

# 启用 B站银河快报自动推送：开启后在目标群发送 /银河快报订阅；首次启动只建立动态基线，不补发旧内容
enable_bilibili_galaxy_news = false

# B站银河快报 UP主 UID（默认是“银河快报”账号的空间 UID）
bilibili_uid = "3546777720457465"

# B站动态监听关键字；动态文字包含此关键字时转发，忽略大小写
bilibili_keyword = "银河快报"

# B站动态轮询间隔（秒）；最小 60，建议 300 或更长，降低风控概率
bilibili_poll_interval = 300

# B站 Cookie（后台监听必填）：从已登录 B站的浏览器请求中复制完整 Cookie，必须包含 SESSDATA；请勿公开或提交到仓库，修改后需重载插件
bilibili_cookie = ""

# B站单张图片最大字节数（默认 16 MiB，超限时缓存层自动降质重编码）
bilibili_image_max_bytes = 16777216

# B站单张长图最大解码像素（银河快报常用超长图；默认 6400 万像素，仍保留解压炸弹防护）
bilibili_image_max_pixels = 64000000


# ──────────── 缓存与限速 ────────────

# 启用后台定时同步；关闭后仅在缓存缺失时按需拉取
enable_background_refresh = true

# API 缓存刷新间隔（秒）；建议 120-300，过短容易触发 429 限流
cache_update_interval = 300

# 批量请求间隔（秒）；刷新多类数据时的请求间隔，建议 ≥3
request_delay = 6

# 任意两次 API 请求最小间隔（秒）；全局限流，降低 429 概率
min_request_interval = 3.0

# API 重试基础延迟（秒）
retry_base_delay = 3.0

# API 重试最大延迟（秒）
retry_max_delay = 15.0

# API 最大重试次数
retry_max_attempts = 2


# ──────────── AI 翻译 ────────────

# 启用 AI 智能翻译：将最高命令/快讯/Steam 更新翻译为中文
enable_translation = true

# 翻译模式：auto=按地址和 Key 自动判断；builtin=第三方翻译接口；openai=OpenAI 兼容 chat/completions
translation_mode = "auto"

# 翻译 API 地址；builtin 模式填完整翻译端点，openai 模式填 base（如 https://api.openai.com/v1）或完整 /chat/completions 地址
translation_api_url = "https://uapis.cn/api/v1/ai/translate"

# 翻译 API Key（openai 模式的 Bearer Token）；builtin 模式可留空
translation_api_key = ""

# 翻译模型名（openai 模式），如 gpt-4o-mini、deepseek-chat 等
translation_model = "gpt-4o-mini"

# OpenAI 兼容翻译使用流式响应；免费/慢速模型建议关闭，流式更容易触发超时和异常
translation_stream = false

# 翻译输出最大 token 数（0=不限制）；防止免费模型输出爆炸，16 条短语约需 800-1000，建议 1000-1500
translation_max_tokens = 1200

# 翻译请求超时（秒）；慢速模型或批量送译时输出更长，建议 60 以上避免批量被超时截断
translation_timeout = 20

# 翻译目标语言
translation_target_lang = "zh-CN"

# 翻译失败回退缓存时间（秒）；失败后短暂记录失败状态避免连续打爆接口，到期后重新尝试翻译
translation_retry_fallback_seconds = 180

# 翻译接口错误冷却时间（秒）；OpenAI 兼容接口返回 429/5xx 后暂停翻译请求，避免拥塞时连续漏翻
translation_error_cooldown_seconds = 120

# 翻译请求最小间隔（秒）；API 有每分钟 N 次配额时填 60/N（如 5 次/分钟填 12），从源头避免 429；0 为不限
translation_min_interval_seconds = 0

# 剔除未翻译英文内容：翻译失败或译文等于原文时不再发送明显英文正文；翻译接口限流（429/冷却）期间例外，保留英文原文稍后自动补翻
drop_untranslated_content = true

# 快讯翻译轮转间隔（秒）
rotation_dispatches = 300

# 最高命令翻译轮转间隔（秒）
rotation_orders = 600

# Steam 更新翻译轮转间隔（秒）
rotation_steam = 900


# ──────────── Steam ────────────

# Steam 更新内容最大长度
steam_max_content_length = 2000

# Steam 平衡性调整节最大长度
steam_balancing_limit = 800

# Steam 修复节最大长度
steam_fixes_limit = 600

# Steam 已知问题节最大长度
steam_issues_limit = 300

# Steam 更新最多展示节数
steam_max_sections = 3

# Steam 游戏 App ID
steam_appid = 553850

# Steam 新闻缓存数量；官方公告接口一次获取的数量，建议 5-20
steam_news_count = 10

# 启用 Steam 新闻主图
steam_image_enabled = true


# ──────────── Wiki ────────────

# 启用 Helldivers Wiki 查询（/wiki）
enable_wiki = true

# Wiki 站点根地址
wiki_base = "https://helldivers.wiki.gg"

# MediaWiki API 路径
wiki_api_path = "/api.php"

# Wiki 搜索候选数量；建议 3-8
wiki_search_limit = 5

# Wiki 摘要最大字符数
wiki_extract_chars = 900

# Wiki 全文模式最大字符数（/wiki 关键词 -f）；建议 2000-4000
wiki_full_extract_chars = 3000

# 优先 Helldivers 2 词条（过滤 Helldivers 1: 前缀）
wiki_prefer_hd2 = true

# 自动翻译 Wiki 摘要为中文（依赖 enable_translation）；启用 drop_untranslated_content 时失败不发送英文摘要
translate_wiki = true

# Wiki 词条缓存有效期（秒）；默认 6 小时
wiki_cache_ttl = 21600

# Wiki 搜索结果缓存有效期（秒）
wiki_search_cache_ttl = 1800


# ──────────── 军需簿 ────────────

# 启用军需簿查询（/hd2data）；数据来自开源 HD2Tool 项目，含官方中文译名和玩家俗称，首次使用自动下载约 500KB 数据，每 24 小时检查更新
enable_arsenal = true


# ──────────── 地图 ────────────

# 启用 /map 战争地图（图片）
enable_map = true

# 地图图片缓存有效期（秒）
map_cache_ttl = 600

# 地图上标注的活跃星球数量
map_label_top_n = 15

# 地图视觉模式：uploaded_reference=使用上传的 map.png 作为圆形银河基底；derived=程序化地图
map_visual_mode = "uploaded_reference"

# 本地图片素材 manifest 路径（留空使用插件内置素材）
asset_manifest_path = ""


# ──────────── 个人任务 ────────────

# 个人任务 JSON 数据源 URL（默认 Companion 社区 CDN，插件会拒绝超过 3 天的旧快照）；未发现 Arrowhead 官方公开 Personal Order API
personal_order_api_url = "https://cdn.helldiverscompanion.com/live/personalOrders/current.json"

# 允许个人指令数据源访问私有网络；仅在使用可信的局域网或本机 JSON 服务时开启，开启后允许 HTTP 和私有 IP
allow_private_personal_order_url = false


# ──────────── 战役趋势 ────────────

# 战役趋势历史保留小时数（1-3）；用于 Warfront 与 Dashboard 的近期净推进速率
campaign_history_hours = 2.0

# 战役趋势采样窗口（分钟，10-30）；用于计算 Recent Liberation Rate
campaign_rate_window_minutes = 20.0


# ──────────── 远程图片 ────────────

# 远程新闻图片最大字节数（仅允许 Steam 官方 CDN，默认 8 MiB）
remote_image_max_bytes = 8388608

# 远程新闻图片最大解码像素
remote_image_max_pixels = 16000000

# 远程图片缓存上限（MiB）
image_cache_max_mb = 150


# ──────────── Dashboard ────────────

# Dashboard 低影响星球玩家数阈值；低于该在线人数的进攻星球会折叠为「低影响星球」汇总
dashboard_low_impact_threshold = 800

# [plugin] 保留节：由 Runner 维护，勿修改
[plugin]
config_version = "1"
